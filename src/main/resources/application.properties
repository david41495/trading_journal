spring.application.name=trade-journal
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trade_journal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:tradejournal_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}